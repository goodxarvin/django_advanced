name: ci docker and deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup docker compose
      run: docker compose up -d
    - name: run tests
      run: docker compose exec backend sh -c "python -m pytest ."

  deploy:
    
    name: deploy

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: connect and execute commands of CD
    - uses: appleboy/ssh-connect@master
    - with:
        username: {{secrets.USERNAME}}
        password: {{secrets.PASSWORD}}
        host: {{secrets.HOST}}
        post: {{secrets.PORT}}
        script: ls
      